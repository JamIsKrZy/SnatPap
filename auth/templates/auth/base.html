<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SnatPap{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0c; /* Solid dark base, no gradient */
            min-height: 100vh;
            position: relative;
            z-index: 0;
            color: #e0e0e0;
        }

        /* Standard Halftone Dot Pattern Gradient */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            /* Creates the dots */
            background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
            /* Masks the dots with a gradient so they fade out smoothly */
            mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 85%);
            z-index: -2;
            pointer-events: none;
        }

        /* Glow Elements */
        .glow-wrapper {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        /* Heavy dark glowing base behind the center */
        .dark-glow {
            position: absolute;
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 70vw; 
            height: 70vh;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.95) 0%, transparent 70%);
        }

        /* Small vibrant glow */
        .vibrant-glow {
            position: absolute;
            top: 40%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 350px; 
            height: 350px;
            background: radial-gradient(circle, rgba(112, 0, 255, 0.15) 0%, rgba(0, 212, 255, 0.05) 60%, transparent 80%);
            filter: blur(40px);
        }

        /* Enhanced Glass Card */
        .glass-card {
            background: rgba(20, 20, 24, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            /* Dark drop shadow combined with a subtle vibrant colored glow */
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.9), /* Dark glow */
                0 0 25px rgba(112, 0, 255, 0.15), /* Small vibrant glow */
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Navbar Enhancements */
        .navbar {
            background: rgba(10, 10, 12, 0.6) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .navbar-brand {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Input & Button Styling */
        .form-control {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-control:focus {
            background-color: rgba(0, 0, 0, 0.6);
            border-color: #7000ff;
            box-shadow: 0 0 0 0.25rem rgba(112, 0, 255, 0.25);
            color: white;
        }

        .btn-primary {
            background-color: #6200ea;
            border-color: #6200ea;
            box-shadow: 0 4px 15px rgba(98, 0, 234, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #7c4dff;
            border-color: #7c4dff;
            box-shadow: 0 6px 20px rgba(124, 77, 255, 0.6);
            transform: translateY(-1px);
        }

        a {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.3s, text-shadow 0.3s;
        }

        a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
        }
    </style>
</head>
<body>

    <!-- Background Glows -->
    <div class="glow-wrapper">
        <div class="dark-glow"></div>
        <div class="vibrant-glow"></div>
    </div>

    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">SnatPap</a>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
            </form>
            {% endif %}
        </div>
    </nav>

    <main class="container py-5">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} bg-opacity-10 border-0 shadow-sm" role="alert">
                {{ message }}
            </div>
        {% endfor %}
        
        {% block content %}{% endblock %}
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
