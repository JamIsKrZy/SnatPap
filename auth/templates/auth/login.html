{% extends 'auth/base.html' %}
{% block title %}Log in | SnatPap{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-4">Welcome back</h1>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autofocus></div>
                    <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div>
                    <button class="btn btn-primary w-100" type="submit">Log in</button>
                </form>
                <p class="text-center text-secondary mt-4 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
