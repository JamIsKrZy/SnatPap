{% extends 'base.html' %}
{% block title %}Log in | SnatPap{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-card">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-4 text-white fw-bold">Welcome back</h1>
                {% for message in messages %}
                    <div class="alert alert-danger bg-opacity-10 border-0 shadow-sm" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-secondary" for="username">Username</label>
                        <input class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary" for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" required>
                    </div>
                    <button class="btn btn-primary w-100 fw-semibold py-2" type="submit">Log in</button>
                </form>
                <p class="text-center text-secondary mt-4 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
