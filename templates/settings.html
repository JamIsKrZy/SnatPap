{% extends 'base.html' %}
{% block title %}Settings | SnatPap{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card glass-card">
            <div class="card-body p-4 p-md-5">
                <h1 class="h2 text-white mb-4">Settings</h1>
                <p class="text-secondary">Update your preferences and account settings here.</p>

                <div class="list-group">
                    <div class="list-group-item bg-transparent border border-light-subtle text-white mb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span>Notification preferences</span>
                            <span class="text-secondary">Enabled</span>
                        </div>
                    </div>
                    <div class="list-group-item bg-transparent border border-light-subtle text-white mb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span>Privacy settings</span>
                            <span class="text-secondary">Standard</span>
                        </div>
                    </div>
                    <div class="list-group-item bg-transparent border border-light-subtle text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <span>Security</span>
                            <span class="text-secondary">Protected</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
